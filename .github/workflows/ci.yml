name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:assets
      - run: npm run budgets
      - run: npm run gen:moves -- --check
      - run: npx playwright install --with-deps chromium
      # The Sproutvale laps (tests/e2e/world.mjs) are off until the exhaustive world pass.
      # Handwritten copy of npm run test:e2e (find-quest.mjs included). world.mjs --laps 1 stays out.
      - run: node tests/e2e/smoke.mjs && node tests/e2e/camps.mjs && node tests/e2e/loading.mjs && node tests/e2e/mount.mjs && node tests/e2e/find-quest.mjs && node tests/e2e/rootdeep.mjs
