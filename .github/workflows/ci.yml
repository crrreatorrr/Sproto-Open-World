name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:assets
      - run: npm run budgets
      - run: npm run gen:moves -- --check
      - run: npx playwright install --with-deps chromium
      # One Sproutvale lap on CI: the runner renders on a software GPU (~4 min a lap there). The
      # three-lap heap check runs locally with `npm run test:e2e`.
      - run: node tests/e2e/smoke.mjs && node tests/e2e/world.mjs --laps 1 && node tests/e2e/camps.mjs
